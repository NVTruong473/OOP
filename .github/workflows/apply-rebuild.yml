name: Apply OOP challenge rebuild

on:
  push:
    branches: [oop-leetcode-rebuild]
    paths:
      - '.github/workflows/apply-rebuild.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: oop-leetcode-rebuild
          fetch-depth: 0

      - name: Verify staged rebuild payload
        shell: bash
        run: |
          set -euo pipefail
          cat .rebuild/chunk01 .rebuild/chunk02 .rebuild/chunk03 .rebuild/chunk04 .rebuild/chunk05 .rebuild/chunk06 .rebuild/chunk07 > /tmp/oop-rebuild.b64
          test "$(wc -c < /tmp/oop-rebuild.b64)" -eq 38024
          base64 --decode /tmp/oop-rebuild.b64 > /tmp/oop-rebuild.tar.gz
          echo '49e31fe1e33e20708d94efcfd524835eb940efdc5186b0283c3c9bf18bd3e4f3  /tmp/oop-rebuild.tar.gz' | sha256sum --check --strict

      - name: Replace legacy archive tree with challenge repository
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch .
          tar -xzf /tmp/oop-rebuild.tar.gz -C .
          git add -A
          git status --short

      - name: Commit rebuilt repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: rebuild coursework as 80 solved OOP challenges'
          git push origin HEAD:oop-leetcode-rebuild
